<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicio PHP</title>
</head>
<body>

    <h2>Servicio PHP – Nombre del estudiante</h2>

    <button onclick="obtenerNombre()">Obtener nombre</button>

    <script>
        function obtenerNombre() {
            fetch("http://valeria-servicio.great-site.net/nombre.php")
                .then(response => response.json())
                .then(data => {
                    alert("Nombre recibido: " + data.nombre);
                })
                .catch(error => {
                    alert("Error al conectar con el servicio PHP");
                    console.error(error);
                });
        }
    </script>

</body>
</html>
