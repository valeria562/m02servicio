<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicio PHP</title>
</head>
<body>

<h2>Servicio PHP</h2>

<button onclick="obtenerNombre()">Mostrar mi nombre</button>

<script>
function obtenerNombre() {
    fetch("http://valeria-.great-site.net/nombre.php")
        .then(res => res.json())
        .then(data => {
            alert("Nombre del estudiante: " + data.nombre);
        })
        .catch(err => {
            alert("Error al obtener el nombre");
            console.error(err);
        });
}
</script>

</body>
</html>
